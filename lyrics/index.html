<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mooii Lyrics</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="../" class="epk-link">← MOOII EPK</a>
    </nav>
    <header>
      <div class="header-inner">
        <h1>Mooii Lyrics</h1>
        <div class="social-icons">
          <a href="https://open.spotify.com/artist/7vKfQwSMeLaGUwXzasgpwv" target="_blank" rel="noopener" aria-label="Spotify" title="Spotify">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10" fill="currentColor" stroke="none" />
              <path d="M6.6 9.6c3.6-1.1 7.6-.8 10.8 1.1" stroke="#0b0c0f" stroke-width="1.9" />
              <path d="M7.1 12.8c3-.9 6.1-.6 8.8.9" stroke="#0b0c0f" stroke-width="1.6" />
              <path d="M7.7 15.7c2.4-.7 4.6-.4 6.7.7" stroke="#0b0c0f" stroke-width="1.3" />
            </svg>
          </a>
          <a href="https://www.instagram.com/bandthemooii/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4.2" />
              <circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none" />
            </svg>
          </a>
          <a href="https://www.youtube.com/@bandthemooii" target="_blank" rel="noopener" aria-label="YouTube" title="YouTube">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path fill="currentColor" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8z" />
              <path fill="#0b0c0f" d="M10 9.2v5.6l4.8-2.8z" />
            </svg>
          </a>
        </div>
      </div>
      <div class="lang-switch">
        <button data-lang="ko">한글</button>
        <button data-lang="en">English</button>
        <button data-lang="es">Español</button>
        <button data-lang="ja">日本語</button>
      </div>

      <!-- Band slogan that changes dynamically based on selected language -->
      <p id="slogan" class="slogan">
        우리가 실제로 보고 겪은 일들을, 최대한 솔직하게
      </p>
    </header>

    <main id="songs-list">
      <!-- 곡 리스트가 JS로 렌더링됩니다 -->
    </main>

    <footer>
      <p class="footer-contact">
        Contact:
        <a href="mailto:themooiiofficial@gmail.com">themooiiofficial@gmail.com</a>
        · Label: 미러볼뮤직
      </p>
      <p>© 2025 Mooii Band</p>
      <p class="footer-note">
        Members: 김다미/김재현/손창현/정민구/ Special Member: 김준성(Ex-bassist)
      </p>
      <p class="footer-note">
        Members: Kim Dami / Kim Jaehyun / Son Changhyun / Jeong
